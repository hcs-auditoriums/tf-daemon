# tf-daemon configuration.
# Every key is optional; anything missing falls back to the defaults in
# tf_daemon/config.py. Unknown keys are logged and ignored. Each device has a
# `source`: the real hardware ("device"), a simulation, or "off".

[server]
host = "0.0.0.0"
port = 8080

[audio]
source = "device"           # device (capture) | synth (test signal) | wav (loop a file, set wav = "path")
# Case-insensitive substring of the capture device name (source = "device").
device = "TF"
# Capture channels (TF5: 32 inputs + St L/R). A device with fewer is zero-padded.
channels = 34
# The TF5 runs at a fixed 48 kHz. Other rates are rejected.
samplerate = 48000
# Frames per capture callback / per synthetic block.
blocksize = 1200
# Length of the per-channel ring buffers, in seconds.
buffer_seconds = 2.0

[dsp]
fft_size = 32768            # ~1.46 Hz bins at 48 kHz
hop = 2400                  # ~20 updates/sec
average_tau = 3.0           # exponential averaging time constant, seconds
display_fmin = 20.0
display_fmax = 20000.0
display_bands_per_octave = 48
db_floor = -140.0

[synth]
# Levels are AES17 dBFS (full-scale sine = 0 dBFS).
# Speech-like content level (RMS while voiced), dBFS.
speech_db = -20.0
# Pink noise bed level (RMS), dBFS.
noise_db = -50.0
# The steady "ringing" tone the feedback detector should find.
tone_hz = 2500.0
tone_db = -15.0             # relative to speech_db
seed = 1

[rf]
# tinySA RF spectrum page (/rf).
source = "device"           # device (tinySA over USB, needs: pip install -e '.[rf]') | demo | off
# Keep the tinySA connected and sweeping from startup, reconnecting if it is
# unplugged, whether or not anyone has the page open. The range defaults to the
# span of the QLX-D receivers (Wireless page) when any are known, else the
# start/stop below. Stop / Disconnect on the page pause this until Start / Connect.
auto_connect = true
# Default sweep (when no receivers are known); the page can change it.
start_hz = 88000000
stop_hz = 108000000
points = 290                # max 450
rbw = "auto"                # auto, or kHz: 3 10 30 100 300 600 850
interval_s = 0.5            # pause between sweeps

[qlxd]
# Read-only monitoring of Shure QLXD4 receivers (/qlxd): battery and RF.
source = "device"           # device | demo (simulated receivers) | off
# NIC the receivers are on. "" = first interface with a 169.254.x.x address.
# The interface and host list are editable on the /qlxd page; those edits are
# saved to state_file and take precedence over the two values here.
interface = ""
hosts = []                  # always-monitored receivers, e.g. ["169.254.10.21"]
state_file = "qlxd_state.json"
meter_poll_s = 1.0          # RF / antenna / audio level poll period
full_poll_s = 10.0          # full parameter refresh (receivers also push changes)

[ring]
# Ring / feedback detection on every analyzed input (Main L/R always).
enabled = true
sensitivity = "normal"      # low | normal | high
fmin = 80.0                 # Hz, detection range
fmax = 12000.0
mains_hz = 60.0             # mains hum harmonics to skip (50 in Europe, 0 = off)

[vocal]
# Vocal EQ assist: during a mic check, listen to a vocal mic while the person
# talks and suggest an HPF and PEQ settings (Mic check button on the audio
# page). Suggestions only: nothing is ever changed on the console.
enabled = false
inputs = []                 # 0-based inputs that are vocal mics; [] = any input
listen_s = 20.0             # seconds of speech to collect
max_cut_db = 6.0            # largest cut / boost it will suggest
max_boost_db = 3.0
mic_type = "generic"        # default mic: generic | wig | lav | headset | handheld (the page picks per channel)
eq_style = "speech"         # default EQ target: speech | speech_singing | singing | projected
# Ring-out (needs tf5.fader_write): raises a mic's fader until it starts to ring,
# notches the ring, and repeats. It never pushes a fader above this, and leaves
# it at least margin dB below where it rang.
ringout_ceiling_db = 6.0
ringout_margin_db = 6.0

[tf5]
# Read channel names and settings (fader, on, pan, colour) from the TF5 over the
# network, using Yamaha's remote control protocol on TCP 49280. The server must
# reach the console's network port. Leave host empty to turn this off.
source = "device"           # device (the console at host) | demo (simulated console) | off
host = ""                   # console IP address, e.g. "192.168.0.128"
port = 49280
# The protocol has no login; these are accepted but not sent to the console.
username = ""
password = ""
poll_s = 30.0               # full re-read; changes on the desk arrive in between
# What each USB capture channel carries, i.e. the TF's USB output patch, which
# the protocol doesn't expose: "InCh N", "St L", "St R", or "" for none.
# [] = the TF default: USB 1-32 = InCh 1-32, USB 33-34 = St L/R.
usb_patch = []
# Are the USB Direct Outs tapped after the fader (Post ON)? Ring attribution adds
# each channel's fader to its USB level unless they are. Pre DG / Pre HPF / Pre
# Fader taps are all before the fader: leave false.
usb_post_fader = false
# Also read every channel's EQ, for the "EQ" overlay on the spectrum. RCP has no
# EQ, so this uses the TF Editor / StageMix protocol on TCP 50368, strictly
# read-only (the client cannot send anything that changes the console). It joins
# as a StageMix client, so it can run alongside TF Editor.
eq = false
eq_port = 50368
# Allow the vocal EQ assist's "Apply to desk" button to set a channel's EQ to the
# suggestion (with Undo). Only ever on a person's click and confirmation; nothing
# is written automatically. Input channels' PEQ only. Needs eq = true.
eq_write = false
# Also let the vocal assist's ring-out session move input channels' faders and
# on switches (it raises gain to find feedback, and its Mute & cancel button
# mutes the channels). Only while a person runs a ring-out. Needs eq_write.
fader_write = false
# Level meters on the audio page's channel bar and console strip, read over RCP
# (mtrstart; only reads, changes nothing on the desk). Unverified on a real TF5:
# probe with `python -m tf_daemon.console.meters --host <console-ip>`.
meters = true
meter_interval_ms = 100
meter_point = "PreFader"    # input channels: PreHPF, PreEQ, PreFader or PostOn

# Named inputs. index is the 0-based capture channel on the device. Every input
# can be viewed in the browser; these get buttons and are always analyzed, the
# rest only while someone is looking at them. An explicit label here beats the
# name read from the console ([tf5]). The TF's default USB patch carries the
# stereo bus on USB 33/34.
[[channels]]
index = 32
label = "Main L"

[[channels]]
index = 33
label = "Main R"
