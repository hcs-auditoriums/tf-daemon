# tf-daemon configuration.
# Every key is optional; anything missing falls back to the defaults in
# tf_daemon/config.py.

[server]
host = "0.0.0.0"
port = 8080

[audio]
# Case-insensitive substring of the capture device name (DeviceSource only).
device = "TF"
# The TF5 runs at a fixed 48 kHz. Other rates are rejected.
samplerate = 48000
# Frames per capture callback / per synthetic block.
blocksize = 1200
# Length of the per-channel ring buffers, in seconds.
buffer_seconds = 2.0

[dsp]
fft_size = 32768            # ~1.46 Hz bins at 48 kHz
hop = 2400                  # ~20 updates/sec
average_tau = 3.0           # exponential averaging time constant, seconds
display_fmin = 50.0
display_fmax = 16000.0
display_bands_per_octave = 48
db_floor = -140.0

[synth]
# Levels are AES17 dBFS (full-scale sine = 0 dBFS).
# Speech-like content level (RMS while voiced), dBFS.
speech_db = -20.0
# Pink noise bed level (RMS), dBFS.
noise_db = -50.0
# The steady "ringing" tone the feedback detector should find.
tone_hz = 2500.0
tone_db = -15.0             # relative to speech_db
seed = 1

[rf]
# tinySA RF spectrum page (/rf). The device is only opened when someone clicks Connect.
enabled = true
source = "device"           # device (tinySA over USB, needs: pip install -e '.[rf]') | demo
# Default sweep; the page can change it per scan.
start_hz = 88000000
stop_hz = 108000000
points = 290                # max 450
rbw = "auto"                # auto, or kHz: 3 10 30 100 300 600 850
interval_s = 0.5            # pause between sweeps

[qlxd]
# Read-only monitoring of Shure QLXD4 receivers (/qlxd): battery and RF.
enabled = true
source = "device"           # device | demo (simulated receivers)
# NIC the receivers are on. "" = first interface with a 169.254.x.x address.
# The interface and host list are editable on the /qlxd page; those edits are
# saved to state_file and take precedence over the two values here.
interface = ""
hosts = []                  # always-monitored receivers, e.g. ["169.254.10.21"]
state_file = "qlxd_state.json"
meter_poll_s = 1.0          # RF / antenna / audio level poll period
full_poll_s = 10.0          # full parameter refresh (receivers also push changes)

[tf5]
# Read channel names and settings (fader, on, pan, colour) from the TF5 over the
# network, using Yamaha's remote control protocol on TCP 49280. The server must
# reach the console's network port. Leave host empty to turn this off.
host = ""                   # console IP address, e.g. "192.168.0.128"
port = 49280
# The protocol has no login; these are accepted but not sent to the console.
username = ""
password = ""
poll_s = 30.0               # full re-read; changes on the desk arrive in between
# What each USB capture channel carries, i.e. the TF's USB output patch, which
# the protocol doesn't expose: "InCh N", "St L", "St R", or "" for none.
# [] = the TF default: USB 1-32 = InCh 1-32, USB 33-34 = St L/R.
usb_patch = []

# Named inputs. index is the 0-based capture channel on the device. Every input
# can be viewed in the browser; these get buttons and are always analyzed, the
# rest only while someone is looking at them.
[[channels]]
index = 0
label = "Main L"

[[channels]]
index = 1
label = "Main R"
