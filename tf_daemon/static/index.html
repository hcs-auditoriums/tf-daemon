<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tf-daemon</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>tf-daemon</h1>
    <nav class="tabs" aria-label="Pages"><a href="/" aria-current="page">Audio</a><a href="/rf">RF</a><a href="/qlxd">Wireless</a><a href="/config">Config</a></nav>
    <details class="menu" id="view-menu">
      <summary>View</summary>
      <div class="menu-panel">
        <fieldset class="seg" id="layout">
          <legend>Layout</legend>
          <label><input type="radio" name="layout" value="spectrum" checked> Spectrum</label>
          <label><input type="radio" name="layout" value="both"> Both</label>
          <label><input type="radio" name="layout" value="waterfall"> Waterfall</label>
        </fieldset>
        <fieldset>
          <legend>Traces</legend>
          <label><input type="checkbox" id="show-avg" checked> Average</label>
          <label><input type="checkbox" id="show-live" checked> Real-time</label>
          <label><input type="checkbox" id="show-peak" checked> Peak hold</label>
        </fieldset>
        <label class="menu-row">Range
          <select id="range">
            <option value="auto" selected>Auto</option>
            <option value="-90,-10">−90…−10 dB</option>
            <option value="-80,0">−80…0 dB</option>
            <option value="-70,-20">−70…−20 dB</option>
            <option value="-130,0">−130…0 dB (noise floor)</option>
          </select>
        </label>
        <fieldset>
          <legend>Waterfall</legend>
          <label class="menu-row">History
            <select id="wf-span">
              <option value="10">10 s</option>
              <option value="30">30 s</option>
              <option value="60">1 min</option>
              <option value="120">2 min</option>
              <option value="300">5 min</option>
            </select>
          </label>
          <label class="menu-row">Source
            <select id="wf-source">
              <option value="live">Real-time</option>
              <option value="avg">Average (3 s)</option>
            </select>
          </label>
        </fieldset>
        <fieldset>
          <legend>Show</legend>
          <label><input type="checkbox" id="show-rings" checked> Rings</label>
          <label id="console-toggle" hidden><input type="checkbox" id="show-console" checked> Console</label>
          <label id="eq-toggle" hidden title="EQ set on the console for this channel (read-only; curve is approximate)"><input type="checkbox" id="show-eq"> EQ</label>
        </fieldset>
        <button id="reset-peak" type="button">Reset peak hold</button>
      </div>
    </details>
    <button id="mic-check" class="mic-btn" type="button" aria-expanded="false" hidden>Mic check</button>
    <div class="status">
      <button id="ring-alert" class="ring-alert" type="button" hidden></button>
      <div id="conn" class="conn" title="Connection">connecting…</div>
    </div>
  </header>
  <div class="chbar">
    <nav id="banks" class="seg" aria-label="Channel bank"></nav>
    <button id="ch-prev" class="ch-step" type="button" aria-label="Previous channel" title="Previous channel">&#8249;</button>
    <nav id="channels" aria-label="Channel"></nav>
    <button id="ch-next" class="ch-step" type="button" aria-label="Next channel" title="Next channel">&#8250;</button>
  </div>
  <div class="workspace">
    <main class="split">
      <div class="pane spectrum" id="spec-pane">
        <canvas id="spectrum" aria-label="Spectrum analyzer"></canvas>
      </div>
      <div class="pane waterfall" id="wf-pane" hidden>
        <canvas id="waterfall" aria-label="Waterfall"></canvas>
      </div>
      <div id="readout" class="readout"></div>
      <button id="console-btn" class="console-btn" type="button" aria-label="Console sidebar" aria-pressed="true" hidden>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 2v12M8 2v12M13 2v12" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1.5" y="9" width="3" height="2" rx=".5"/><rect x="6.5" y="4" width="3" height="2" rx=".5"/><rect x="11.5" y="7" width="3" height="2" rx=".5"/></svg>
      </button>
      <div id="ring-list" class="ring-list" hidden></div>
      <div id="vocal-panel" class="vocal-panel" hidden></div>
    </main>
    <aside id="console-panel" class="console-panel" aria-label="Console channel" hidden></aside>
  </div>
  <footer id="info"></footer>
  <script src="/static/nav.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
