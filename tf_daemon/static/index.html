<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tf-daemon</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>tf-daemon</h1>
    <a class="navlink" href="/rf">RF ›</a>
    <a class="navlink" href="/qlxd">Wireless ›</a>
    <a class="navlink" href="/config">Config</a>
    <nav id="channels" aria-label="Channel"></nav>
    <div class="controls">
      <label><input type="checkbox" id="show-avg" checked> Average</label>
      <label><input type="checkbox" id="show-peak" checked> Peak hold</label>
      <label>Range
        <select id="range">
          <option value="-120,0">−120…0 dB</option>
          <option value="-100,-20" selected>−100…−20 dB</option>
          <option value="-80,-20">−80…−20 dB</option>
        </select>
      </label>
      <button id="reset-peak" type="button">Reset peak</button>
      <label><input type="checkbox" id="show-rings" checked> Rings</label>
      <label id="console-toggle" hidden><input type="checkbox" id="show-console" checked> Console</label>
    </div>
    <button id="ring-alert" class="ring-alert" type="button" hidden></button>
    <div id="conn" class="conn" title="Connection">connecting…</div>
  </header>
  <div class="workspace">
    <main>
      <canvas id="spectrum" aria-label="Spectrum analyzer"></canvas>
      <div id="readout" class="readout"></div>
      <div id="ring-list" class="ring-list" hidden></div>
    </main>
    <aside id="console-panel" class="console-panel" aria-label="Console channel" hidden></aside>
  </div>
  <footer id="info"></footer>
  <script src="/static/app.js"></script>
</body>
</html>
