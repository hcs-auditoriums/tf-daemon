[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-daemon"
version = "0.1.0"
description = "Raspberry Pi appliance: real-time spectrum analyzer and feedback detector for a Yamaha TF5 over USB audio, plus a tinySA RF spectrum view and Shure QLX-D receiver monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "numpy>=2.0",
    "sounddevice>=0.4.6",
    "gunicorn>=22.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
rf = ["tsapython>=2.0"]
dev = ["pytest>=8", "pytest-xdist>=3.5", "ruff>=0.15", "mypy>=1.15", "playwright>=1.50"]

[project.scripts]
tf-daemon = "tf_daemon.__main__:main"

[tool.setuptools.packages.find]
include = ["tf_daemon*"]

[tool.setuptools.package-data]
tf_daemon = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"   # short failure output
# Shared test modules (helpers, editor_fakes, tf_editor_reference) are imported from tests/ subdirectories too.
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
# Layout is ruff format's job (it wraps code at 120); a long string or comment is fine.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as argument defaults.
extend-immutable-calls = ["tf_daemon.dsp.ring.RingSettings"]

[tool.mypy]
files = ["tf_daemon"]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# No type information published for these.
module = ["sounddevice", "tsapython", "flask_sock", "simple_websocket", "psutil"]
ignore_missing_imports = true
